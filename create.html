<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>

    <h2>Create Your Account</h2>
    <form action="" method="post">
        <div class="create">
            <label for="birth">Enter Your Birth:</label><br><br>
            <input type="date" name="birth" id="birth" required><br><br>
            <label for="firstname">First Name:</label><br><br>
            <input type="text" name="firstname" id="firstname" required placeholder="First Name"><br><br>
            <label for="lastname">Last Name:</label><br><br>
            <input type="text" name="lastname" id="lastname"required placeholder="First Name"><br><br>
        <label for="username" style="color: rgb(12, 7, 7);">Username:</label><br><br>
        <input type="text" id="username" name="username" required placeholder="Your Username" ><br><br>
        
        <label for="email" style="color: rgb(17, 16, 16);">Email:</label><br><br>
        <input type="email" id="email" name="email" required placeholder="Your Email"><br><br>
        
        <label for="password" style="color: rgb(15, 11, 11);">Password:</label><br><br>

        <input type="password" id="password" name="password" required placeholder="Your Password"><br><br>
        <label for="confirmpassword">Confirm Password:</label><br><br>
         <input type="password" id="password" name="password" required placeholder="Confirm Your Password"><br><br>
        
        <button id="create">Create Account </button>
        </div>
</body>
</html>
